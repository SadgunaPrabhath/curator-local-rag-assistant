[server]
# Turn off the file watcher — it needlessly probes vision libraries
# (transformers image models) that we don't use, spamming harmless errors.
fileWatcherType = "none"
# Cap uploads so a giant PDF can't exhaust memory (embedding runs on CPU).
maxUploadSize = 25

[browser]
gatherUsageStats = false

# Curator — museum charcoal + gold (charts use plotly_dark + gold palette in app.py).
[theme]
base = "dark"
primaryColor = "#C9A24B"
backgroundColor = "#13110E"
secondaryBackgroundColor = "#1C1915"
textColor = "#ECE6DA"
font = "sans serif"
